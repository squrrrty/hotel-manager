{% extends "base.html" %}
{% block title %}Вход — HotelManager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <p class="eyebrow">С ВОЗВРАЩЕНИЕМ</p>
<h3 class="card-title mb-4">Вход в систему</h3>
<p class="form-hint">Войдите, чтобы начать работу с отелем.</p>
                <form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="username">Логин</label>
                        <input id="username" type="text" autocomplete="username" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Пароль</label>
                        <input id="password" type="password" autocomplete="current-password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                {% if not config.get('PRODUCTION') %}
                <p class="text-muted mt-3 mb-0 small">
                    Тестовый доступ: <code>admin</code> / <code>admin123</code>
                </p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
