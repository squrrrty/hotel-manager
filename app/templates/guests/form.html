{% extends "base.html" %}
{% block title %}{{ 'Редактировать гостя' if guest else 'Новый гость' }} — HotelManager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ 'Редактировать гостя' if guest else 'Новый гость' }}</h3>

                <form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="full_name">ФИО *</label>
                        <input id="full_name" type="text" name="full_name" class="form-control" required
                               value="{{ request.form.get('full_name', guest.full_name if guest else '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="passport">Паспорт</label>
                        <input id="passport" type="text" name="passport" class="form-control"
                               value="{{ request.form.get('passport', guest.passport if guest and guest.passport else '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phone">Телефон</label>
                        <input id="phone" type="text" name="phone" class="form-control"
                               value="{{ request.form.get('phone', guest.phone if guest and guest.phone else '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" type="email" name="email" class="form-control"
                               value="{{ request.form.get('email', guest.email if guest and guest.email else '') }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a class="btn btn-secondary" href="{{ url_for('guests.list_guests') }}">Назад</a>
                        <button class="btn btn-primary" type="submit">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
